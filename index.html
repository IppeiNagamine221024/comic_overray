<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漫画風リアルタイム字幕オーバーレイ（OBS用）</title>
  <!-- OBSブラウザソースはローカルファイルまたはローカルサーバーから読み込み可能 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 背景はクロマキー用の緑。画面キャプチャ＋OBS の色キーで透過させる -->
  <div id="app" class="app" aria-live="polite" aria-atomic="true">
    <!-- 上部：吹き出しプレビュー用ステージ -->
    <div class="stage-area" id="stage-area">
      <div id="status-panel" class="status-panel" role="status">
        <p id="status-message" class="status-message">マイクと音声認識の準備中です…</p>
        <p class="status-hint"><kbd>Esc</kbd> キーで認識とマイクを停止できます（ブラウザソースにフォーカスがあるとき）。</p>
        <button id="start-button" type="button" class="start-button">認識を開始</button>
      </div>

      <div
        id="bubble-wrap"
        class="bubble-wrap bubble-wrap--hidden"
        data-volume-tier="normal"
        data-tail-direction="left"
        aria-hidden="true"
      >
        <div class="bubble-shaker">
          <div id="bubble" class="bubble">
            <p id="subtitle" class="subtitle"></p>
          </div>
          <div class="bubble-tail" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <!-- 下部：見た目のカスタマイズ -->
    <aside class="settings-panel" id="settings-panel" aria-label="表示設定">
      <h2 class="settings-panel__title">表示設定</h2>
      <p class="settings-panel__note">ここでの変更は自動で保存され、次回開いたときに復元されます。</p>
      <div class="settings-panel__row">
        <label class="settings-panel__label" for="font-preset-select">フォント</label>
        <select id="font-preset-select" class="settings-panel__select">
          <option value="default">デフォルト（ゴシック系）</option>
          <option value="gothic">メイリオ・ヒラギノ優先</option>
          <option value="yugo">游ゴシック</option>
          <option value="msgothic">MS ゴシック体</option>
          <option value="mincho">明朝体</option>
        </select>
      </div>
      <div class="settings-panel__row settings-panel__row--inline">
        <label class="settings-panel__label" for="text-color-input">文字の色</label>
        <input id="text-color-input" class="settings-panel__color" type="color" value="#111111" title="字幕の文字色" />
        <span id="text-color-hex" class="settings-panel__hex" aria-hidden="true">#111111</span>
      </div>
      <div class="settings-panel__row">
        <label class="settings-panel__label" for="tail-direction-select">しっぽの向き</label>
        <select id="tail-direction-select" class="settings-panel__select">
          <option value="left">左下へ（左のキャラ向け）</option>
          <option value="right">右下へ（右のキャラ向け）</option>
          <option value="bottom">下中央へ</option>
          <option value="top-left">左上へ（キャラが左下のとき）</option>
          <option value="top-right">右上へ（キャラが右下のとき）</option>
        </select>
      </div>
      <div class="settings-panel__row settings-panel__row--inline">
        <label class="settings-panel__label" for="subtitle-duration-input">消えるまで</label>
        <input
          id="subtitle-duration-input"
          class="settings-panel__number"
          type="number"
          min="1"
          max="120"
          step="1"
          value="4"
          title="字幕が最後の更新から消えるまでの秒数（1〜120）"
        />
        <span class="settings-panel__unit" aria-hidden="true">秒</span>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
